<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💡 Gemini DSA Chatbot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 30% 20%, #0f172a, #020617);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      text-align: center;
      padding: 16px;
      background: rgba(30, 41, 59, 0.7);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { text-shadow: 0 0 10px #3b82f6; }
      50% { text-shadow: 0 0 20px #60a5fa; }
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
      position: relative;
      white-space: pre-wrap;
    }
   

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 0 8px rgba(96,165,250,0.4);
    }
    .bot {
      align-self: flex-start;
      background: rgba(255,255,255,0.07);
      border-bottom-left-radius: 4px;
      color: #cbd5e1;
      box-shadow: 0 0 8px rgba(148,163,184,0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    footer {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(30,41,59,0.7);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    textarea {
      flex: 1;
      resize: none;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: rgba(15,23,42,0.8);
      color: #f1f5f9;
      font-size: 14px;
      box-shadow: inset 0 0 4px rgba(59,130,246,0.2);
      transition: all 0.2s;
    }
    textarea:focus {
      outline: none;
      box-shadow: 0 0 8px rgba(96,165,250,0.4);
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    }
    .typing {
      display: inline-block;
      font-style: italic;
      color: #94a3b8;
      font-size: 14px;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0.5; }
    }
    .intro {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-top: 12px;
      animation: fadeIn 1s ease;
    }
  </style>
</head>
<body>
  <header>💬 Your OWN DSA Instructor</header>
  <main id="chat">
    <div class="intro">Ask me anything about Data Structures and Algorithms! 🤓<br>But beware — ask something off-topic, and I’ll roast you 🔥</div>
  </main>
  <footer>
    <textarea id="input" placeholder="Type your DSA question..."></textarea>
    <button id="send">🚀 Send</button>
  </footer>

  <audio id="sendSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1f65c8c428.mp3?filename=click-124467.mp3"></audio>
  <audio id="receiveSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2e210ecb47.mp3?filename=interface-124464.mp3"></audio>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // ⚠️ Replace with your Gemini API key for local use
    const GEMINI_API_KEY = "AIzaSyDFTaAmp_7OevGFRamhN-D1zMmTDNebMgY";

    const model = new GoogleGenerativeAI(GEMINI_API_KEY).getGenerativeModel({
      model: "gemini-2.0-flash-001",
      systemInstruction: `
        You are a Data Structure and Algorithm Instructor.
        You answer only DSA-related questions politely and simply.
        If asked something unrelated, respond rudely or sarcastically.
        Be slightly funny and conversational.
        Explain pointwise.
      `,
    });

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const sendSound = document.getElementById("sendSound");
    const receiveSound = document.getElementById("receiveSound");

    const history = [];

    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    function playSound(audio) {
      audio.currentTime = 0;
      audio.play().catch(() => {}); // ignore autoplay restrictions
    }

    function typeEffect(el, text, speed = 25) {
      el.textContent = "";
      let i = 0;
      const interval = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) clearInterval(interval);
        chat.scrollTop = chat.scrollHeight;
      }, speed);
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      playSound(sendSound);

      addMessage("user", text);
      input.value = "";

      const typing = addMessage("bot", "Typing...");
      typing.classList.add("typing");

      history.push({ role: "user", parts: [{ text }] });

      try {
        const result = await model.generateContent({ contents: history });
        const reply = result.response.text();

        typing.classList.remove("typing");
        typing.textContent = "";
        playSound(receiveSound);

        typeEffect(typing, reply);
        history.push({ role: "model", parts: [{ text: reply }] });
      } catch (err) {
        typing.classList.remove("typing");
        typing.textContent = "⚠️ Error: " + err.message;
      }
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
